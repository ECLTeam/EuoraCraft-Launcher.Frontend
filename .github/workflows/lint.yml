name: Check quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check quality
        run: pnpm check

  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Read fixed governance revision
        id: governance
        shell: bash
        run: |
          revision="$(cat tests/browser/governance-revision.txt)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ECLTeam/EuoraCraft-Launcher
          ref: ${{ steps.governance.outputs.revision }}
          path: .governance-source
          persist-credentials: false
          sparse-checkout: |
            ECL/tooling
            docs/governance
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install tools and dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          pnpm install --frozen-lockfile
      - name: Collect audit reports
        run: |
          python .governance-source/ECL/tooling/governance.py audit --kind pnpm-audit --scope frontend-production --frontend . --production --output build/governance/frontend-production.json
          python .governance-source/ECL/tooling/governance.py audit --kind pnpm-audit --scope frontend-all --frontend . --output build/governance/frontend-all.json
      - name: Scan actual pages
        run: pnpm test:accessibility --report build/governance/frontend-accessibility.json
      - name: Enforce reports
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import subprocess, sys
          results = []
          for scope in ("frontend-production", "frontend-all", "frontend-accessibility"):
              results.append(subprocess.call([sys.executable, ".governance-source/ECL/tooling/governance.py", "check",
                  "--scope", scope, "--report", f"build/governance/{scope}.json",
                  "--exceptions", ".governance-source/docs/governance/exceptions.json"]))
          sys.exit(1 if any(results) else 0)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engineering-governance
          path: build/governance/
          retention-days: 14
